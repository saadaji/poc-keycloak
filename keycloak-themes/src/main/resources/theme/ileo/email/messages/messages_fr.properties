passwordResetBodyHtml=<p>Bonjour,<br><br>Pas d''inqui\u00e9tudes. Vous pouvez r\u00e9initialiser votre mot de passe Hubgrade Pass en cliquant sur le lien suivant : <a href="{0}">r\u00e9initialiser votre mot de passe</a></p><p>Si vous n''avez pas demand\u00e9 la r\u00e9initialisation de votre mot de passe, vous pouvez supprimer cet e-mail.</p><p>Cordialement,<br>L&apos;\u00e9quipe Hubgrade Pass<br>Veolia Eau France</p>


