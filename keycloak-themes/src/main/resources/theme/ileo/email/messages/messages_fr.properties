emailCodeBody=Bonjour,<BR><BR>Voici votre code \u00e0 usage unique pour vous connecter au keycloak Ileo :<BR><B><font size="5">{0}</font></B><BR><BR>Ce code est valable 5 minutes.<BR><BR><BR>Pourquoi recevez-vous cet email ?<BR>Une authentification multi-facteurs, ou authentification forte, est d\u00e9sormais n\u00e9cessaire pour tout acc\u00e8s aux applications Veolia Eau France.<BR><BR>Vous n'\u00eates pas \u00e0 l'origine de cette connexion  ?<BR>Si vous n'avez pas souhait\u00e9 vous connecter r\u00e9cemment \u00e0 une application Veolia Eau France, nous vous invitons \u00e0 changer votre mot de passe et \u00e0 en informer votre correspondant Veolia au plus vite.<BR><BR>Cordialement,


emailVerificationBody=Bonjour, \n\nDans le cadre de votre relation avec Veolia Eau France, votre compte Hubgrade Pass vient d'\u00eatre cr\u00e9\u00e9.\nHubgrade Pass, qu'est-ce que c'est ? Il s'agit du compte gr\u00e2ce auquel vous allez pouvoir acc\u00e9der de mani\u00e8re ergonomique et s\u00e9curis\u00e9e aux applications Veolia Eau France.\n\n<a href="{0}">Cliquez ici pour activer votre compte Hubgrade Pass</a>\n\nCe lien expire dans 7 jours.\n\nPour toute question, n'h\u00e9sitez pas \u00e0 joindre votre contact Veolia.\n\nCordialement,\nL'\u00e9quipe Hubgrade Pass\nVeolia Eau France

emailVerificationBodyHtml=<p>Bonjour,</p><p>Dans le cadre de votre relation avec Veolia Eau France, votre compte Hubgrade Pass vient d&apos;\u00eatre cr\u00e9\u00e9.</p><p>Hubgrade Pass, qu&apos;est-ce que c&apos;est ?   C&apos;est la solution s\u00e9curis\u00e9e de gestion des acc\u00e8s de Veolia Eau France. Elle a \u00e9t\u00e9 mise en place pour r\u00e9pondre \u00e0 2 enjeux :</p><p>- disposer d&apos;une infrastructure s\u00e9curis\u00e9e, moderne et adapt\u00e9e pour g\u00e9rer les acc\u00e8s de nos partenaires ext\u00e9rieurs (clients collectivit\u00e9s, industriels et fournisseurs) sans les obliger \u00e0 utiliser un compte Google de Veolia<br>- s\u00e9curiser les acc\u00e8s aux services digitaux de Veolia Eau France<br>Gr\u00e2ce \u00e0 votre compte Hubgrade Pass vous allez pouvoir acc\u00e9der de mani\u00e8re ergonomique et s\u00e9curis\u00e9e aux applications Veolia Eau France.</p><p><a href="{0}">Cliquez ici pour activer votre compte Hubgrade Pass</a></p><p>Ce lien expire dans 7 jours.</p><p>Pour toute question, n&apos;h\u00e9sitez pas \u00e0 joindre votre contact Veolia.</p><p>Cordialement,<br>L&apos;\u00e9quipe Hubgrade Pass<br>Veolia Eau France</p>


