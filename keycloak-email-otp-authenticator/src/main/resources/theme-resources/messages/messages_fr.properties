emailAuthText=<p>Bonjour,</p><p>Voici votre mot de passe \u00e0 usage unique pour vous connecter aux applications Veolia Eau France gr\u00e2ce \u00e0 Hubgrade Pass :<br><b>%1$s</b><br><br><b>Ce code est valable 5 minutes.</b></p><p><br>Pourquoi recevez-vous cet email ?<br>Une authentification multi-facteurs, ou authentification forte, est d\u00e9sormais n\u00e9cessaire pour tout acc\u00e8s aux applications Veolia Eau France.<br><br>Vous n'\u00eates pas \u00e0 l'origine de cette connexion ?<br>Si vous n'avez pas souhait\u00e9 vous connecter r\u00e9cemment \u00e0 une application Veolia Eau France ou \u00e0 Hubgrade Pass, nous vous invitons \u00e0 changer votre mot de passe et \u00e0 en informer votre correspondant Veolia au plus vite.</p><p>Cordialement,<br>L'\u00e9quipe Veolia - Hubgrade Pass</p>

