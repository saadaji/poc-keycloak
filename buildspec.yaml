version: 0.1
phases:
  pre_build:
    commands:
      - echo "============== PRE-BUILD ============="
      - pwd
      - echo "TAG =  ${TAG}"
      - echo "ECR_REPOSITORY_URL =  ${ECR_REPOSITORY_URL}"
      - echo "REGION =  ${REGION}"
      - aws ecr get-login-password --region ${REGION} | docker login --username AWS --password-stdin ${ECR_REPOSITORY_URL}
  build:
    commands:
      - echo "================ BUILD ==============="
      - docker build --rm --no-cache -t ${ECR_REPOSITORY_URL}:${TAG} .
  post_build:
    commands:
      - echo "============== POST-BUILD ============"
      - docker push ${ECR_REPOSITORY_URL}:${TAG}
